<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One Smart Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060810;
  --bg-deep: #030509;
  --card: rgba(160, 180, 220, 0.05);
  --card-hover: rgba(160, 180, 220, 0.09);
  --border: rgba(180, 200, 240, 0.1);
  --silver-1: #e8eef8;
  --silver-2: #b8c4dc;
  --silver-3: #8892ac;
  --silver-4: #5a6280;
  --neon-blue: #4a9eff;
  --neon-blue-bright: #6bb2ff;
  --neon-glow: rgba(74, 158, 255, 0.6);
  --bronze: #8b6f47;
  --text: #eef2ff;
  --muted: #7a849e;
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 100px;
}
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: 
    radial-gradient(ellipse at 50% 0%, rgba(30, 50, 100, 0.5) 0%, transparent 50%),
    radial-gradient(ellipse at 0% 50%, rgba(20, 30, 60, 0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(40, 20, 60, 0.3) 0%, transparent 50%),
    var(--bg-deep);
}
.bg-layer::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(140, 170, 255, 0.08) 1px, transparent 1px);
  background-size: 30px 30px;
  mask-image: radial-gradient(ellipse at 50% 40%, black 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 20%, transparent 75%);
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  animation: float 24s ease-in-out infinite;
}
.orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #2a4a8f, transparent 70%); top: -150px; right: -100px; opacity: 0.5; }
.orb-2 { width: 350px; height: 350px; background: radial-gradient(circle, #3a2860, transparent 70%); bottom: 10%; left: -130px; animation-delay: -8s; opacity: 0.4; }
.orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #4a9eff, transparent 70%); top: 50%; right: -150px; opacity: 0.15; animation-delay: -16s; }
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -40px) scale(1.15); }
  66% { transform: translate(-30px, 30px) scale(0.92); }
}
.sparkle {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 8px 2px rgba(150, 200, 255, 0.8);
  animation: sparkle 4s ease-in-out infinite;
}
@keyframes sparkle {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}
.gem {
  position: absolute;
  width: 6px; height: 6px;
  background: linear-gradient(135deg, #6bb2ff, #1e3a8a);
  border-radius: 1px;
  transform: rotate(45deg);
  box-shadow: 0 0 10px rgba(107, 178, 255, 0.9), inset 0 0 3px rgba(255,255,255,0.7);
  animation: gemGlow 3s ease-in-out infinite;
}
@keyframes gemGlow {
  0%, 100% { opacity: 0.6; box-shadow: 0 0 8px rgba(107, 178, 255, 0.6); }
  50% { opacity: 1; box-shadow: 0 0 16px rgba(107, 178, 255, 1); }
}
.container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 14px; }
.hero { text-align: center; padding: 40px 16px 26px; position: relative; }
.logo-badge {
  width: 110px;
  height: 110px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #4a5878 0%, #1a2238 50%, #060810 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  position: relative;
  box-shadow:
    inset 0 0 0 2px rgba(200, 220, 255, 0.25),
    inset 0 0 30px rgba(74, 158, 255, 0.15),
    inset 0 2px 4px rgba(255, 255, 255, 0.2),
    0 0 0 1px rgba(139, 111, 71, 0.5),
    0 0 0 6px rgba(30, 25, 18, 0.9),
    0 0 0 7px rgba(139, 111, 71, 0.4),
    0 0 0 10px rgba(30, 25, 18, 0.6),
    0 15px 50px rgba(74, 158, 255, 0.35),
    0 0 80px rgba(74, 158, 255, 0.2);
  animation: logoFloat 4s ease-in-out infinite;
}
.logo-badge::before {
  content: '';
  position: absolute;
  inset: -22px;
  border-radius: 50%;
  border: 1px solid rgba(74, 158, 255, 0.25);
  animation: ringPulse 3.5s ease-out infinite;
}
.logo-badge::after {
  content: '';
  position: absolute;
  inset: -38px;
  border-radius: 50%;
  border: 1px solid rgba(74, 158, 255, 0.1);
  animation: ringPulse 3.5s ease-out infinite;
  animation-delay: 0.8s;
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes ringPulse {
  0% { opacity: 0.9; transform: scale(0.92); }
  100% { opacity: 0; transform: scale(1.15); }
}
.logo-gem {
  position: absolute;
  width: 8px; height: 8px;
  background: linear-gradient(135deg, #6bb2ff, #1e3a8a);
  border-radius: 2px;
  transform: rotate(45deg);
  box-shadow: 0 0 14px rgba(107, 178, 255, 1), inset 0 0 4px rgba(255,255,255,0.6);
  animation: gemGlow 3s ease-in-out infinite;
}
.lg-1 { top: 8px; right: 12px; }
.lg-2 { bottom: 8px; left: 12px; animation-delay: -1.5s; }
.lg-3 { top: 50%; left: -10px; animation-delay: -0.7s; }
.lg-4 { top: 50%; right: -10px; animation-delay: -2.2s; }
.hero h1 {
  font-family: 'Orbitron', 'Vazirmatn', sans-serif;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(180deg, #ffffff 0%, #c8d4ec 35%, #6bb2ff 50%, #c8d4ec 65%, #6a7090 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  filter: drop-shadow(0 2px 0 rgba(30, 50, 100, 0.9)) drop-shadow(0 0 20px rgba(74, 158, 255, 0.6));
}
.hero .subtitle {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  color: #8892ac;
  letter-spacing: 6px;
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 6px;
  text-shadow: 0 0 12px rgba(74, 158, 255, 0.4);
}
.hero .persian-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.stats { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
.stat {
  flex: 1;
  max-width: 140px;
  background: linear-gradient(180deg, rgba(160, 180, 220, 0.08), rgba(160, 180, 220, 0.02));
  border: 1px solid rgba(180, 200, 240, 0.12);
  border-radius: 14px;
  padding: 11px 6px;
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200, 220, 255, 0.6), transparent);
}
.stat-num {
  font-family: 'Orbitron', 'Vazirmatn', sans-serif;
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(180deg, #ffffff, #8892ac);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 2px;
  text-shadow: 0 0 12px rgba(74, 158, 255, 0.3);
}
.stat-label { font-size: 10px; color: var(--muted); }
.searchbar {
  margin: 0 auto 20px;
  max-width: 400px;
  background: linear-gradient(180deg, rgba(160, 180, 220, 0.07), rgba(160, 180, 220, 0.02));
  border: 1px solid rgba(180, 200, 240, 0.1);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(12px);
  transition: 0.3s;
}
.searchbar:focus-within {
  border-color: rgba(74, 158, 255, 0.4);
  box-shadow: 0 0 24px rgba(74, 158, 255, 0.2);
}
.searchbar input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  flex: 1;
}
.searchbar input::placeholder { color: var(--muted); }
.cats-wrap {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 12px 0;
  margin-bottom: 8px;
  background: linear-gradient(180deg, rgba(6, 8, 16, 0.98) 60%, rgba(6, 8, 16, 0));
  backdrop-filter: blur(10px);
}
.categories { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
.categories::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0;
  background: linear-gradient(180deg, rgba(160, 180, 220, 0.07), rgba(160, 180, 220, 0.02));
  color: var(--text);
  border: 1px solid rgba(180, 200, 240, 0.1);
  padding: 9px 18px;
  border-radius: 30px;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s;
  backdrop-filter: blur(10px);
}
.cat-btn:active { transform: scale(0.95); }
.cat-btn.active {
  background: linear-gradient(180deg, #e8eef8 0%, #a8b4cc 50%, #6a7590 100%);
  color: #060810;
  border-color: transparent;
  font-weight: 800;
  box-shadow: 0 6px 24px rgba(74, 158, 255, 0.45), 0 0 40px rgba(74, 158, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}
.products { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.card {
  background: linear-gradient(180deg, rgba(160, 180, 220, 0.07) 0%, rgba(160, 180, 220, 0.02) 100%);
  border: 1px solid rgba(180, 200, 240, 0.1);
  border-radius: 20px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  backdrop-filter: blur(14px);
  animation: cardIn 0.5s backwards;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200, 220, 255, 0.5), transparent);
}
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(74, 158, 255, 0.2), transparent 65%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.card:active {
  transform: scale(0.96);
  border-color: rgba(74, 158, 255, 0.4);
  background: linear-gradient(180deg, rgba(160, 180, 220, 0.12) 0%, rgba(160, 180, 220, 0.04) 100%);
  box-shadow: 0 8px 32px rgba(74, 158, 255, 0.2);
}
.card:active::after { opacity: 1; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.img-box {
  width: 72px;
  height: 72px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #3a4a6a 0%, #1a2238 55%, #0a0e1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  position: relative;
  box-shadow:
    inset 0 0 0 1px rgba(200, 220, 255, 0.15),
    inset 0 0 20px rgba(74, 158, 255, 0.15),
    inset 0 1px 2px rgba(255, 255, 255, 0.15),
    0 0 0 1px rgba(139, 111, 71, 0.35),
    0 0 0 3px rgba(20, 16, 12, 0.8),
    0 0 0 4px rgba(139, 111, 71, 0.25),
    0 6px 20px rgba(74, 158, 255, 0.2);
}
.img-box::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% -10%, rgba(74, 158, 255, 0.4), transparent 60%);
  pointer-events: none;
}
.img-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 2px 8px rgba(74, 158, 255, 0.5)) drop-shadow(0 0 4px rgba(255,255,255,0.2));
}
.card h3 {
  font-size: 12.5px;
  font-weight: 700;
  margin-bottom: 6px;
  text-align: center;
  direction: ltr;
  line-height: 1.35;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #ffffff, #b8c4dc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 10px rgba(74, 158, 255, 0.2);
}
.card .desc { font-size: 10.5px; color: var(--muted); margin-bottom: 10px; text-align: center; line-height: 1.4; min-height: 28px; }
.card .price {
  font-family: 'Orbitron', 'Vazirmatn', sans-serif;
  font-size: 14px;
  font-weight: 800;
  background: linear-gradient(180deg, #ffffff 0%, #c8d4ec 40%, #6bb2ff 55%, #c8d4ec 70%, #8892ac 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 12px;
  letter-spacing: -0.3px;
  filter: drop-shadow(0 0 12px rgba(74, 158, 255, 0.5));
}
.card button {
  background: linear-gradient(180deg, #e8eef8 0%, #b8c4dc 45%, #6a7590 100%);
  color: #060810;
  border: none;
  padding: 10px;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  font-size: 12.5px;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
  box-shadow: 0 4px 16px rgba(74, 158, 255, 0.3), 0 0 24px rgba(74, 158, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 0 rgba(60, 80, 130, 0.4);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}
.card button::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
  transition: left 0.6s;
}
.card:active button::after { left: 100%; }
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 12px 14px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(6, 8, 16, 0) 0%, rgba(6, 8, 16, 0.98) 40%);
  backdrop-filter: blur(16px);
  display: flex;
  gap: 8px;
  max-width: 720px;
  margin: 0 auto;
}
.bottom-btn {
  flex: 1;
  padding: 13px;
  border-radius: 14px;
  border: 1px solid rgba(180, 200, 240, 0.12);
  background: linear-gradient(180deg, rgba(160, 180, 220, 0.08), rgba(160, 180, 220, 0.03));
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: 0.25s;
  backdrop-filter: blur(12px);
}
.bottom-btn:active { transform: scale(0.96); }
.bottom-btn.primary {
  background: linear-gradient(180deg, #e8eef8 0%, #b8c4dc 45%, #6a7590 100%);
  color: #060810;
  border-color: transparent;
  box-shadow: 0 6px 24px rgba(74, 158, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  font-weight: 800;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(180deg, #e8eef8 0%, #a8b4cc 50%, #6a7590 100%);
  color: #060810;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 800;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  box-shadow: 0 8px 32px rgba(74, 158, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.7);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
@media (max-width: 360px) {
  .hero h1 { font-size: 24px; letter-spacing: 2px; }
  .stat-num { font-size: 14px; }
  .card h3 { font-size: 11.5px; }
  .card .price { font-size: 13px; }
  .logo-badge { width: 96px; height: 96px; font-size: 44px; }
}
</style>
</head>

  { id:20, name:"Apple Gift Card $50", desc:"Apple Gift Card", price:0, cat:"gift", img: BASE + "giftcartapple.png" },

  // ===== رجیستری =====
  { id:22, name:"Mobile Registration", desc:"ثبت گوشی روی کد ملی", price:0, cat:"registry", img: BASE + "register.jpg" },

  // ===== Apple ID =====
  { id:23, name:"Apple ID Ready", desc:"اکانت اپل آماده و فعال", price:0, cat:"appleid", img: BASE + "appleid.jpg" },
  { id:24, name:"Apple ID Personal", desc:"با ایمیل و اطلاعات خودت", price:0, cat:"appleid", img: BASE + "appleid.jpg" },
  { id:25, name:"Apple ID Unlock", desc:"رفع قفل اکانت اپل", price:0, cat:"appleid", img: BASE + "appleid.jpg" },
];

const categories = [
  { key:"all", label:"✨ همه" },
  { key:"ai", label:"🧠 هوش مصنوعی" },
  { key:"premium", label:"📱 پرمیوم" },
  { key:"gift", label:"🍎 گیفت‌کارت" },
  { key:"registry", label:"📲 رجیستری" },
  { key:"appleid", label:"🆔 Apple ID" },
];

let activeCat = "all";
let searchQuery = "";

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = categories.map(c =>
    `<button class="cat-btn ${c.key===activeCat?'active':''}" onclick="setCat('${c.key}')">${c.label}</button>`
  ).join('');
}

function setCat(key) {
  activeCat = key;
  renderCategories();
  renderProducts();
}

function formatPrice(p) {
  if (!p) return "رایگان";
  return toPersian(p.toLocaleString('en-US')) + " تومان";
}

function renderProducts() {
  const el = document.getElementById('products');
  let list = activeCat === 'all' ? products : products.filter(p => p.cat === activeCat);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.desc.includes(searchQuery));
  }
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="icon">🔍</div>محصولی یافت نشد</div>`;
    return;
  }
  el.innerHTML = list.map((p, i) => {
    return `
    <div class="card" style="animation-delay: ${i * 0.04}s" onclick="order(${p.id})">
      <div class="img-box"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
      <h3>${p.name}</h3>
      <div class="desc">${p.desc}</div>
      <div class="price">${formatPrice(p.price)}</div>
      <button>🛒 سفارش</button>
    </div>
  `;
  }).join('');
}

// ================= سفارش =================
function order(productId) {
  showToast('⏳ انتقال به صفحه پرداخت...');
  
  const botUrl = `https://t.me/${BOT_USERNAME}?start=order_${productId}`;
  const botTgUrl = `tg://resolve?domain=${BOT_USERNAME}&start=order_${productId}`;
  
  let opened = false;
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      window.Telegram.WebApp.openTelegramLink(botUrl);
      opened = true;
    }
  } catch(e) {}
  
  if (!opened) {
    try { window.location.href = botTgUrl; opened = true; } catch(e) {}
  }
  
  if (!opened) {
    window.location.href = botUrl;
  }
  
  setTimeout(() => {
    try {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
        window.Telegram.WebApp.close();
      }
    } catch(e) {}
  }, 600);
}

function openTelegram(username, text) {
  const encodedText = text ? encodeURIComponent(text) : '';
  const httpsUrl = 'https://t.me/' + username + (encodedText ? '?text=' + encodedText : '');
  const tgUrl = 'tg://resolve?domain=' + username + (encodedText ? '&text=' + encodedText : '');

  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      window.Telegram.WebApp.openTelegramLink(httpsUrl);
      return true;
    }
  } catch(e) {}

  try { window.location.href = tgUrl; return true; } catch(e) {}
  try { window.location.href = httpsUrl; return true; } catch(e) {}
  return false;
}

function showToast(msg) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function openSupport() {
  showToast('📞 در حال باز کردن پشتیبانی...');
  openTelegram(SUPPORT_USERNAME, 'سلام، نیاز به پشتیبانی دارم');
}

function openChannel() {
  showToast('📣 در حال باز کردن کانال...');
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      window.Telegram.WebApp.openTelegramLink(CHANNEL_URL);
      return;
    }
  } catch(e) {}
  window.location.href = CHANNEL_URL;
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderProducts();
});

renderCategories();
renderProducts();

if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  try { Telegram.WebApp.setHeaderColor('#060810'); } catch(e) {}
}
</script>
