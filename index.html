<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One Smart Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg:#0b1220; --card:#121c2e; --accent:#f5b301; --text:#e8eefc; --muted:#8da2c0; }
* { box-sizing: border-box; margin:0; padding:0; }
body { font-family: Tahoma, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
header { padding: 20px; text-align: center; background: linear-gradient(180deg, #101a2c, #0b1220); border-bottom: 1px solid #1e2a44; }
header h1 { font-size: 22px; color: var(--accent); margin-bottom: 6px; }
header p { font-size: 13px; color: var(--muted); }
.categories { display: flex; gap: 8px; overflow-x: auto; padding: 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid #1e2a44; }
.cat-btn { background: var(--card); color: var(--text); border: 1px solid #23314d; padding: 8px 14px; border-radius: 20px; white-space: nowrap; font-size: 13px; cursor: pointer; }
.cat-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
.products { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
.card { background: var(--card); border-radius: 16px; padding: 12px; border: 1px solid #1e2a44; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
.card:active { transform: scale(0.97); border-color: var(--accent); }
.card .img-box { width: 70px; height: 70px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; background: #0b1220; border-radius: 14px; padding: 8px; }
.card .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
.card h3 { font-size: 14px; margin-bottom: 6px; text-align: center; }
.card p { font-size: 12px; color: var(--muted); margin-bottom: 8px; flex: 1; text-align: center; }
.card .price { font-size: 14px; font-weight: bold; color: var(--accent); margin-bottom: 8px; text-align: center; }
.card button { background: var(--accent); color: #000; border: none; padding: 8px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: #101a2c; border-top: 1px solid #1e2a44; padding: 12px; text-align: center; font-size: 12px; color: var(--muted); }
footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 999; opacity: 0; transition: opacity 0.3s; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>One Smart Shop</h1>
  <p>خرید آنی سرویس‌های VPN، هوش مصنوعی و خدمات موبایل</p>
</header>
<div class="categories" id="categories"></div>
<div class="products" id="products"></div>
<footer>
  پشتیبانی: <a onclick="openSupport()">@manager_1smart1</a>
</footer>

<script>
const BASE = "https://saeidtiger7724-svg.github.io/onesmart-shop/logos/";

const products = [
  // --- VPN ---
  { id:1, name:"V2ray 1 ماهه 10 گیگ", desc:"مناسب استفاده روزمره", price:50000, cat:"VPN", img: BASE + "v2ray.jpg" },
  { id:2, name:"V2ray 1 ماهه 20 گیگ", desc:"سرعت بالا، IP ثابت", price:100000, cat:"VPN", img: BASE + "v2ray.jpg" },
  { id:3, name:"V2ray 1 ماهه 30 گیگ", desc:"برای مصرف متوسط", price:150000, cat:"VPN", img: BASE + "v2ray.jpg" },
  { id:4, name:"V2ray 1 ماهه 40 گیگ", desc:"مناسب استریم", price:200000, cat:"VPN", img: BASE + "v2ray.jpg" },
  { id:5, name:"V2ray 1 ماهه 60 گیگ", desc:"پلن حرفه‌ای", price:300000, cat:"VPN", img: BASE + "v2ray.jpg" },
  { id:6, name:"V2ray 100 روزه 100 گیگ", desc:"پلن ویژه", price:500000, cat:"VPN", img: BASE + "v2ray.jpg" },
  { id:7, name:"Cisco / OpenVPN / L2TP", desc:"1 ماهه نامحدود، هر 3 پروتکل", price:350000, cat:"VPN", img: BASE + "cisco.png" },
  { id:8, name:"L2TP اختصاصی", desc:"1 ماهه نامحدود، تک‌کاربره", price:300000, cat:"VPN", img: BASE + "l2tp.jpg" },
  { id:9, name:"OpenVPN اختصاصی", desc:"1 ماهه نامحدود، تک‌کاربره", price:300000, cat:"VPN", img: BASE + "openvpn.jpg" },

  // --- AI ---
  { id:10, name:"ChatGPT Plus", desc:"اکانت رسمی OpenAI", price:0, cat:"AI", img: BASE + "chatgpt.png" },
  { id:11, name:"ChatGPT Go", desc:"اکانت اقتصادی", price:0, cat:"AI", img: BASE + "chatgptgo.png" },
  { id:12, name:"Gemini Pro", desc:"اکانت پرمیوم گوگل", price:0, cat:"AI", img: BASE + "gemini.png" },

  // --- Premium ---
  { id:13, name:"پرمیوم تلگرام 3 ماهه", desc:"تحویل فوری", price:0, cat:"Premium", img: BASE + "telegram.png" },
  { id:14, name:"پرمیوم تلگرام 6 ماهه", desc:"تحویل فوری", price:0, cat:"Premium", img: BASE + "telegram.png" },
  { id:15, name:"پرمیوم تلگرام 12 ماهه", desc:"تحویل فوری", price:0, cat:"Premium", img: BASE + "telegram.png" },
  { id:16, name:"پرمیوم توییتر (X)", desc:"اکانت پرمیوم X", price:0, cat:"Premium", img: BASE + "x.png" },

  // --- Gift ---
  { id:17, name:"گیفت‌کارت اپل 2$", desc:"Apple Gift Card", price:0, cat:"Gift", img: BASE + "giftcartapple.png" },
  { id:18, name:"گیفت‌کارت اپل 10$", desc:"Apple Gift Card", price:0, cat:"Gift", img: BASE + "giftcartapple.png" },
  { id:19, name:"گیفت‌کارت اپل 25$", desc:"Apple Gift Card", price:0, cat:"Gift", img: BASE + "giftcartapple.png" },
  { id:20, name:"گیفت‌کارت اپل 50$", desc:"Apple Gift Card", price:0, cat:"Gift", img: BASE + "giftcartapple.png" },
  { id:21, name:"گیفت‌کارت اپل 100$", desc:"Apple Gift Card", price:0, cat:"Gift", img: BASE + "giftcartapple.png" },

  // --- رجیستری ---
  { id:22, name:"رجیستری گوشی موبایل", desc:"ثبت گوشی روی کد ملی", price:0, cat:"Registry", img: BASE + "register.jpg" },

  // --- Apple ID ---
  { id:23, name:"Apple ID آماده", desc:"اکانت اپل آماده و فعال", price:0, cat:"AppleID", img: BASE + "appleid.jpg" },
  { id:24, name:"Apple ID شخصی", desc:"با ایمیل و اطلاعات خودت", price:0, cat:"AppleID", img: BASE + "appleid.jpg" },
  { id:25, name:"آنلاک Apple ID", desc:"رفع قفل اکانت اپل", price:0, cat:"AppleID", img: BASE + "appleid.jpg" },
];

const categories = [
  { key:"all", label:"همه" },
  { key:"VPN", label:"VPN" },
  { key:"AI", label:"هوش مصنوعی" },
  { key:"Premium", label:"پرمیوم" },
  { key:"Gift", label:"گیفت‌کارت" },
  { key:"Registry", label:"رجیستری" },
  { key:"AppleID", label:"Apple ID" },
];

const SUPPORT_USERNAME = "manager_1smart1";
let activeCat = "all";

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = categories.map(c => 
    `<button class="cat-btn ${c.key===activeCat?'active':''}" onclick="setCat('${c.key}')">${c.label}</button>`
  ).join('');
}

function setCat(key) {
  activeCat = key;
  renderCategories();
  renderProducts();
}

function formatPrice(p) {
  if (!p) return "استعلام قیمت";
  return p.toLocaleString('fa-IR') + " تومان";
}

function renderProducts() {
  const el = document.getElementById('products');
  const list = activeCat === 'all' ? products : products.filter(p => p.cat === activeCat);
  el.innerHTML = list.map(p => {
    const safeName = p.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `
    <div class="card" onclick="order('${safeName}')">
      <div class="img-box"><img src="${p.img}" alt="${p.name}"></div>
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="price">${formatPrice(p.price)}</div>
      <button>🛒 سفارش</button>
    </div>
  `;
  }).join('');
}

function openTelegram(username, text) {
  const encodedText = text ? encodeURIComponent(text) : '';
  const httpsUrl = 'https://t.me/' + username + (encodedText ? '?text=' + encodedText : '');
  const tgUrl = 'tg://resolve?domain=' + username + (encodedText ? '&text=' + encodedText : '');

  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      window.Telegram.WebApp.openTelegramLink(httpsUrl);
      return true;
    }
  } catch(e) {}

  try {
    window.location.href = tgUrl;
    return true;
  } catch(e) {}

  try {
    window.location.href = httpsUrl;
    return true;
  } catch(e) {}

  return false;
}

function order(name) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = '⏳ در حال انتقال به پشتیبانی...';
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);

  openTelegram(SUPPORT_USERNAME, 'سلام، برای سفارش ' + name + ' راهنمایی می‌خوام');

  setTimeout(() => {
    if (document.body.contains(toast)) document.body.removeChild(toast);
  }, 2000);
}

function openSupport() {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = '⏳ در حال باز کردن پشتیبانی...';
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);

  openTelegram(SUPPORT_USERNAME, 'سلام، نیاز به پشتیبانی دارم');

  setTimeout(() => {
    if (document.body.contains(toast)) document.body.removeChild(toast);
  }, 2000);
}

renderCategories();
renderProducts();

if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}
</script>
</body>
</html>
