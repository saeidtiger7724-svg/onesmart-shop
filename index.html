<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One Smart Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080d;
  --bg2: #0d0f1a;
  --card: rgba(255, 255, 255, 0.04);
  --card-hover: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(245, 179, 1, 0.4);
  --accent: #f5b301;
  --accent2: #ffd700;
  --accent-glow: rgba(245, 179, 1, 0.35);
  --purple: #8b5cf6;
  --blue: #3b82f6;
  --text: #f1f5f9;
  --muted: #8b94a7;
  --success: #22c55e;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 100px;
}

/* ===== Background animated orbs ===== */
.bg-orbs {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.25;
  animation: float 20s ease-in-out infinite;
}
.orb-1 { width: 300px; height: 300px; background: var(--purple); top: -100px; right: -80px; animation-delay: 0s; }
.orb-2 { width: 260px; height: 260px; background: var(--blue); bottom: 20%; left: -100px; animation-delay: -7s; }
.orb-3 { width: 240px; height: 240px; background: var(--accent); top: 40%; right: -120px; opacity: 0.12; animation-delay: -14s; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.95); }
}

/* ===== Container ===== */
.container {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 14px;
}

/* ===== Hero Header ===== */
.hero {
  text-align: center;
  padding: 32px 16px 20px;
  position: relative;
}
.logo-badge {
  width: 84px;
  height: 84px;
  margin: 0 auto 16px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--accent), #b8860b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.1) inset,
    0 10px 40px rgba(245, 179, 1, 0.4),
    0 0 80px rgba(245, 179, 1, 0.15);
  position: relative;
  animation: logoPulse 3s ease-in-out infinite;
}
.logo-badge::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 30px;
  border: 2px solid rgba(245, 179, 1, 0.2);
  animation: ringPulse 2.5s ease-out infinite;
}
@keyframes logoPulse {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes ringPulse {
  0% { opacity: 0.6; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.2); }
}

.hero h1 {
  font-size: 26px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #ffd700 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.hero p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

/* ===== Stats row ===== */
.stats {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 8px;
}
.stat {
  flex: 1;
  max-width: 140px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 6px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.stat-num {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 2px;
}
.stat-label {
  font-size: 10px;
  color: var(--muted);
}

/* ===== Search bar (visual only) ===== */
.searchbar {
  margin: 0 auto 20px;
  max-width: 400px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(12px);
  transition: 0.3s;
}
.searchbar:focus-within { border-color: var(--accent); }
.searchbar input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  flex: 1;
}
.searchbar input::placeholder { color: var(--muted); }
.searchbar span { color: var(--muted); font-size: 16px; }

/* ===== Categories ===== */
.cats-wrap {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 12px 0;
  margin-bottom: 8px;
  background: linear-gradient(180deg, rgba(7,8,13,0.95) 60%, rgba(7,8,13,0));
  backdrop-filter: blur(8px);
}
.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0;
  scrollbar-width: none;
}
.categories::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 18px;
  border-radius: 30px;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.25s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.cat-btn:active { transform: scale(0.95); }
.cat-btn.active {
  background: linear-gradient(135deg, var(--accent), #b8860b);
  color: #000;
  border-color: transparent;
  font-weight: 700;
  box-shadow: 0 6px 24px var(--accent-glow);
}

/* ===== Products Grid ===== */
.products {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: cardIn 0.5s backwards;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(245, 179, 1, 0.15), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.card:active {
  transform: scale(0.96);
  border-color: var(--border-hover);
  background: var(--card-hover);
}
.card:active::before { opacity: 1; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.img-box {
  width: 68px;
  height: 68px;
  margin: 0 auto 12px;
  border-radius: 18px;
  background: radial-gradient(circle at center, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  position: relative;
  border: 1px solid rgba(255,255,255,0.06);
}
.img-box img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
}

.card h3 {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  text-align: center;
  direction: ltr;
  line-height: 1.35;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card .desc {
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: 10px;
  text-align: center;
  line-height: 1.4;
  min-height: 28px;
}
.card .price {
  font-size: 15px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin-bottom: 12px;
  letter-spacing: -0.3px;
}
.card button {
  background: linear-gradient(135deg, var(--accent) 0%, #b8860b 100%);
  color: #000;
  border: none;
  padding: 10px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  font-size: 12.5px;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
  box-shadow: 0 4px 16px rgba(245, 179, 1, 0.25);
}
.card button::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: left 0.6s;
}
.card:active button::after { left: 100%; }

/* ===== Bottom Fixed Bar ===== */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 12px 14px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(7,8,13,0) 0%, rgba(7,8,13,0.95) 40%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  gap: 8px;
  max-width: 720px;
  margin: 0 auto;
}
.bottom-btn {
  flex: 1;
  padding: 13px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: 0.25s;
  backdrop-filter: blur(12px);
}
.bottom-btn:active { transform: scale(0.96); }
.bottom-btn.primary {
  background: linear-gradient(135deg, var(--accent), #b8860b);
  color: #000;
  border-color: transparent;
  box-shadow: 0 6px 24px var(--accent-glow);
  flex: 1.4;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg, var(--accent), #b8860b);
  color: #000;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  box-shadow: 0 8px 32px var(--accent-glow);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Empty state ===== */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

/* ===== Responsive ===== */
@media (max-width: 360px) {
  .hero h1 { font-size: 22px; }
  .stat-num { font-size: 13px; }
  .card h3 { font-size: 12px; }
  .card .price { font-size: 14px; }
}
</style>
</head>
<body>

<!-- Background orbs -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="container">

  <!-- Hero -->
  <div class="hero">
    <div class="logo-badge">🛒</div>
    <h1>One Smart Shop</h1>
    <p>فروشگاه رسمی خدمات دیجیتال</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">۲۵+</div>
        <div class="stat-label">محصول</div>
      </div>
      <div class="stat">
        <div class="stat-num">۲۴/۷</div>
        <div class="stat-label">پشتیبانی</div>
      </div>
      <div class="stat">
        <div class="stat-num">⚡</div>
        <div class="stat-label">تحویل فوری</div>
      </div>
    </div>
  </div>

  <!-- Search (visual only) -->
  <div class="searchbar">
    <span>🔍</span>
    <input type="text" placeholder="جستجوی محصول..." id="searchInput">
  </div>

  <!-- Categories -->
  <div class="cats-wrap">
    <div class="categories" id="categories"></div>
  </div>

  <!-- Products -->
  <div class="products" id="products"></div>

</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <button class="bottom-btn" onclick="openSupport()">📞 پشتیبانی</button>
  <button class="bottom-btn primary" onclick="openChannel()">📣 کانال ما</button>
</div>

<script>
const BASE = "https://saeidtiger7724-svg.github.io/onesmart-shop/logos/";
const SUPPORT_USERNAME = "manager_1smart1";
const CHANNEL_URL = "https://t.me/supprt_1smart1";

// تبدیل اعداد به فارسی
function toPersian(text) {
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(text).replace(/[0-9]/g, d => map[d]);
}

const products = [
  { id:1, name:"V2ray 10 GB", desc:"مناسب استفاده روزمره", price:50000, cat:"vpn", img: BASE + "v2ray.jpg" },
  { id:2, name:"V2ray 20 GB", desc:"سرعت بالا، IP ثابت", price:100000, cat:"vpn", img: BASE + "v2ray.jpg" },
  { id:3, name:"V2ray 30 GB", desc:"برای مصرف متوسط", price:150000, cat:"vpn", img: BASE + "v2ray.jpg" },
  { id:4, name:"V2ray 40 GB", desc:"مناسب استریم", price:200000, cat:"vpn", img: BASE + "v2ray.jpg" },
  { id:5, name:"V2ray 60 GB", desc:"پلن حرفه‌ای", price:300000, cat:"vpn", img: BASE + "v2ray.jpg" },
  { id:6, name:"V2ray 100 GB - 100 Days", desc:"پلن ویژه", price:500000, cat:"vpn", img: BASE + "v2ray.jpg" },
  { id:7, name:"Cisco - 1 Month - Unlimited", desc:"نامحدود، تک‌کاربره", price:350000, cat:"vpn", img: BASE + "cisco.png" },
  { id:8, name:"L2TP - 1 Month - Unlimited", desc:"نامحدود، تک‌کاربره", price:350000, cat:"vpn", img: BASE + "l2tp.jpg" },
  { id:9, name:"OpenVPN - 1 Month - Unlimited", desc:"نامحدود، تک‌کاربره", price:350000, cat:"vpn", img: BASE + "openvpn.jpg" },

  { id:10, name:"ChatGPT Plus", desc:"اکانت رسمی OpenAI", price:0, cat:"ai", img: BASE + "chatgpt.png" },
  { id:11, name:"ChatGPT Go", desc:"اکانت اقتصادی", price:0, cat:"ai", img: BASE + "chatgptgo.png" },
  { id:12, name:"Gemini Pro", desc:"اکانت پرمیوم گوگل", price:0, cat:"ai", img: BASE + "gemini.png" },

  { id:13, name:"Telegram Premium 3 Months", desc:"تحویل فوری", price:0, cat:"premium", img: BASE + "telegram.png" },
  { id:14, name:"Telegram Premium 6 Months", desc:"تحویل فوری", price:0, cat:"premium", img: BASE + "telegram.png" },
  { id:15, name:"Telegram Premium 12 Months", desc:"تحویل فوری", price:0, cat:"premium", img: BASE + "telegram.png" },
  { id:16, name:"Twitter Premium (X)", desc:"اکانت پرمیوم X", price:0, cat:"premium", img: BASE + "x.png" },

  { id:17, name:"Apple Gift Card $2", desc:"Apple Gift Card", price:0, cat:"gift", img: BASE + "giftcartapple.png" },
  { id:18, name:"Apple Gift Card $10", desc:"Apple Gift Card", price:0, cat:"gift", img: BASE + "giftcartapple.png" },
  { id:19, name:"Apple Gift Card $25", desc:"Apple Gift Card", price:0, cat:"gift", img: BASE + "giftcartapple.png" },
  { id:20, name:"Apple Gift Card $50", desc:"Apple Gift Card", price:0, cat:"gift", img: BASE + "giftcartapple.png" },
  { id:21, name:"Apple Gift Card $100", desc:"Apple Gift Card", price:0, cat:"gift", img: BASE + "giftcartapple.png" },

  { id:22, name:"Mobile Registration", desc:"ثبت گوشی روی کد ملی", price:0, cat:"registry", img: BASE + "register.jpg" },

  { id:23, name:"Apple ID Ready", desc:"اکانت اپل آماده و فعال", price:0, cat:"appleid", img: BASE + "appleid.jpg" },
  { id:24, name:"Apple ID Personal", desc:"با ایمیل و اطلاعات خودت", price:0, cat:"appleid", img: BASE + "appleid.jpg" },
  { id:25, name:"Apple ID Unlock", desc:"رفع قفل اکانت اپل", price:0, cat:"appleid", img: BASE + "appleid.jpg" },
];

const categories = [
  { key:"all", label:"✨ همه" },
  { key:"vpn", label:"🌐 VPN" },
  { key:"ai", label:"🧠 هوش مصنوعی" },
  { key:"premium", label:"📱 پرمیوم" },
  { key:"gift", label:"🍎 گیفت‌کارت" },
  { key:"registry", label:"📲 رجیستری" },
  { key:"appleid", label:"🆔 Apple ID" },
];

let activeCat = "all";
let searchQuery = "";

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = categories.map(c =>
    `<button class="cat-btn ${c.key===activeCat?'active':''}" onclick="setCat('${c.key}')">${c.label}</button>`
  ).join('');
}

function setCat(key) {
  activeCat = key;
  renderCategories();
  renderProducts();
}

function formatPrice(p) {
  if (!p) return "استعلام";
  return toPersian(p.toLocaleString('en-US')) + " تومان";
}

function renderProducts() {
  const el = document.getElementById('products');
  let list = activeCat === 'all' ? products : products.filter(p => p.cat === activeCat);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.desc.includes(searchQuery));
  }

  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="icon">🔍</div>محصولی یافت نشد</div>`;
    return;
  }

  el.innerHTML = list.map((p, i) => {
    const safeName = p.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `
    <div class="card" style="animation-delay: ${i * 0.04}s" onclick="order('${safeName}')">
      <div class="img-box"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
      <h3>${p.name}</h3>
      <div class="desc">${p.desc}</div>
      <div class="price">${formatPrice(p.price)}</div>
      <button>🛒 سفارش</button>
    </div>
  `;
  }).join('');
}

function openTelegram(username, text) {
  const encodedText = text ? encodeURIComponent(text) : '';
  const httpsUrl = 'https://t.me/' + username + (encodedText ? '?text=' + encodedText : '');
  const tgUrl = 'tg://resolve?domain=' + username + (encodedText ? '&text=' + encodedText : '');

  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      window.Telegram.WebApp.openTelegramLink(httpsUrl);
      return true;
    }
  } catch(e) {}

  try { window.location.href = tgUrl; return true; } catch(e) {}
  try { window.location.href = httpsUrl; return true; } catch(e) {}
  return false;
}

function showToast(msg) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function order(name) {
  showToast('⏳ انتقال به پشتیبانی...');
  openTelegram(SUPPORT_USERNAME, 'سلام، برای سفارش ' + name + ' راهنمایی می‌خوام');
}

function openSupport() {
  showToast('📞 در حال باز کردن پشتیبانی...');
  openTelegram(SUPPORT_USERNAME, 'سلام، نیاز به پشتیبانی دارم');
}

function openChannel() {
  showToast('📣 در حال باز کردن کانال...');
  try {
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
      window.Telegram.WebApp.openTelegramLink(CHANNEL_URL);
      return;
    }
  } catch(e) {}
  window.location.href = CHANNEL_URL;
}

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim();
  renderProducts();
});

// Init
renderCategories();
renderProducts();

if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  try { Telegram.WebApp.setHeaderColor('#07080d'); } catch(e) {}
}
</script>
</body>
</html>
